<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background-color: #09090b;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      cursor: pointer;
      position: relative;
    }

    /* Subtle ambient background glow */
    body::before {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      animation: floatGlow 6s ease-in-out infinite alternate;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.75rem, 4vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      padding: 1rem 2rem;
      background: linear-gradient(90deg, #94a3b8, #ffffff, #38bdf8, #ffffff, #94a3b8);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation:
        fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards,
        shimmer 5s linear infinite;
      transition: transform 0.2s ease;
      z-index: 2;
    }

    /* Pop animation when clicked */
    h1.pop {
      animation:
        popText 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        shimmer 5s linear infinite;
    }

    /* Ripple circle on click */
    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(56, 189, 248, 0.45);
      transform: translate(-50%, -50%) scale(0);
      animation: rippleOut 0.7s ease-out forwards;
      pointer-events: none;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    @keyframes floatGlow {
      from {
        transform: translate(-25px, -15px) scale(0.95);
      }
      to {
        transform: translate(25px, 15px) scale(1.08);
      }
    }

    @keyframes popText {
      0% { transform: scale(1); }
      45% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes rippleOut {
      to {
        width: 240px;
        height: 240px;
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }
  </style>
</head>
<body>

  <h1 id="message">Whatever you clicked on, is coming soon.</h1>

  <script>
    const message = document.getElementById("message");

    document.addEventListener("click", (e) => {
      // Trigger subtle text bounce
      message.classList.remove("pop");
      void message.offsetWidth;
      message.classList.add("pop");

      // Create ripple at cursor position
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.left = `${e.clientX}px`;
      ripple.style.top = `${e.clientY}px`;
      document.body.appendChild(ripple);

      ripple.addEventListener("animationend", () => ripple.remove());
    });
  </script>

</body>
</html>
